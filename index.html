<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff4c7">
<link rel="manifest" href="manifest.json">
<title>City Group Stock Manager</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6fb;
  color:#18213a;
  font-family:Arial,sans-serif
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 14px 35px
}

header{
  text-align:center;
  padding:10px 0 18px
}

h1{margin:0;font-size:28px}
.sub{font-size:19px;margin-top:3px}
header p{color:#777}

.card{
  background:#fff;
  border-radius:18px;
  padding:17px;
  margin:12px 0;
  box-shadow:0 3px 15px #0001
}

h2{
  font-size:20px;
  margin:0 0 14px
}

.voicebox{
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px
}

textarea,input{
  width:100%;
  padding:13px;
  border:1px solid #d9dce5;
  border-radius:12px;
  font-size:16px
}

textarea{
  height:82px;
  resize:vertical
}

.buttons,
.stats,
.actions,
.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

button{
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-weight:600;
  cursor:pointer
}

.speak{background:#f9c83d}
.process{background:#18213a;color:white}

.status{
  margin-top:10px;
  background:#f1f2f5;
  border-radius:10px;
  padding:10px;
  min-height:40px;
  color:#555
}

.stat{
  padding:17px;
  text-align:center;
  border-radius:15px;
  background:#eeeaff
}

.stat:nth-child(2){
  background:#fff1bd
}

.stat b{
  display:block;
  font-size:26px;
  margin-top:5px
}

.action{
  background:#f7f8fb;
  border:1px solid #e4e6ec;
  text-align:left
}

.action small{
  display:block;
  color:#777;
  margin-top:4px;
  font-weight:400
}

.add{
  background:#16a34a;
  color:#fff;
  width:100%;
  margin-top:10px
}

.cancel{
  background:#eee;
  width:100%;
  margin-top:7px
}

.hidden{display:none}
.search{margin-bottom:10px}

.wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th,td{
  text-align:left;
  padding:10px 7px;
  border-bottom:1px solid #eee;
  white-space:nowrap
}

th{background:#f4f4f5}

.row button{
  padding:7px 8px;
  font-size:12px;
  margin-right:3px
}

.empty{
  text-align:center;
  color:#777;
  padding:20px
}

@media(max-width:480px){
  .app{padding:10px}
  h1{font-size:25px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div style="font-size:30px">🏢</div>
  <h1>CITY GROUP</h1>
  <div class="sub">Stock Manager</div>
  <p>Speak Your Stock Command</p>
</header>


<!-- VOICE COMMAND -->

<section class="card">

<h2>🎙️ Voice Command</h2>

<div class="voicebox">

<div style="color:#777;font-size:13px;margin-bottom:8px">
Example: “40 density ke 4 inch ke 2 gadde bik gaye”
</div>

<textarea
  id="cmd"
  placeholder="Speak or type your command..."
></textarea>

<div class="buttons">

<button class="speak" id="speak">
🎙️ Speak
</button>

<button class="process" id="process">
⚡ Process
</button>

</div>

<div class="status" id="status">
Ready.
</div>

</div>
</section>


<!-- OVERVIEW -->

<section class="card">

<h2>📊 Overview</h2>

<div class="stats">

<div class="stat">
Total Stock Units
<b id="total">0</b>
</div>

<div class="stat">
Inventory Value
<b id="value">₹0</b>
</div>

</div>

</section>


<!-- QUICK ACTIONS -->

<section class="card">

<h2>⚡ Quick Actions</h2>

<div class="actions">

<button class="action" id="stockInBtn">
➕ Stock In
<small>Add stock</small>
</button>

<button class="action" id="stockOutBtn">
➖ Stock Out
<small>Sell / remove</small>
</button>

<button class="action" id="inventoryBtn">
📦 Inventory
<small>Add product</small>
</button>

<button class="action" id="rateBtn">
💰 Rate List
<small>Search rates</small>
</button>

</div>

</section>


<!-- PRODUCT FORM -->

<section class="card hidden" id="form">

<h2 id="formTitle">
➕ Add Product
</h2>

<div class="formgrid">

<input
 id="product"
 placeholder="Product (e.g. Gadda)"
>

<input
 id="density"
 placeholder="Density (e.g. 40)"
>

<input
 id="thickness"
 placeholder="Thickness (e.g. 4 inch)"
>

<input
 id="unit"
 placeholder="Unit (e.g. pcs)"
 value="pcs"
>

<input
 id="stock"
 type="number"
 min="0"
 placeholder="Stock"
>

<input
 id="rate"
 type="number"
 min="0"
 placeholder="Rate"
>

</div>

<button class="add" id="saveProductBtn">
💾 Save
</button>

<button class="cancel" id="cancelBtn">
Cancel
</button>

</section>


<!-- INVENTORY -->

<section class="card">

<h2>📦 Current Inventory</h2>

<input
 class="search"
 id="search"
 placeholder="🔎 Search product, density, thickness..."
>

<div class="wrap">

<table>

<thead>

<tr>
<th>Product</th>
<th>Density</th>
<th>Thickness</th>
<th>Unit</th>
<th>Stock</th>
<th>Rate</th>
<th>Action</th>
</tr>

</thead>

<tbody id="body"></tbody>

</table>

</div>

</section>

</div>


<script>

/* =========================================================
   DATABASE
========================================================= */

const KEY = "city_group_stock_manager_v1";

let data = [];

try {

  const raw = localStorage.getItem(KEY);

  data = raw ? JSON.parse(raw) : [];

  if (!Array.isArray(data)) {
    data = [];
  }

} catch(e) {

  data = [];

}


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);


function norm(s){

  return String(s ?? "")
    .toLowerCase()
    .replace(/[\u200B-\u200D\uFEFF]/g,"")

    /* Hindi words */
    .replace(/डेंसिटी/g," density ")
    .replace(/घनत्व/g," density ")

    .replace(/इंच/g," inch ")

    .replace(/गद्दों/g," gadde ")
    .replace(/गद्दे/g," gadde ")
    .replace(/गद्दा/g," gadda ")

    .replace(/बिक\s*गए/g," bik gaye ")
    .replace(/बिक\s*गये/g," bik gaye ")
    .replace(/बिके/g," bike ")
    .replace(/बिका/g," bika ")

    .replace(/बेच\s*दिए/g," bech diye ")
    .replace(/बेच\s*दिये/g," bech diye ")

    .replace(/निकाल\s*दिए/g," nikal diye ")

    .replace(/[^\p{L}\p{N}.\s-]/gu," ")

    .replace(/\s+/g," ")
    .trim();
}


function money(n){

  return "₹" +
    Number(n || 0).toLocaleString("en-IN",{
      maximumFractionDigits:2
    });

}


function esc(s){

  return String(s ?? "")
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}


function makeId(){

  if(
    window.crypto &&
    typeof crypto.randomUUID === "function"
  ){
    return crypto.randomUUID();
  }

  return "id_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2);

}


/* =========================================================
   SAVE
========================================================= */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );

    render();

    return true;

  }catch(e){

    alert(
      "Data save nahi ho pa raha. Browser storage blocked hai."
    );

    return false;
  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const q = norm(
    $("search").value
  );

  const list = data.filter(p => {

    if(!q) return true;

    return [
      p.product,
      p.density,
      p.thickness,
      p.unit,
      p.stock,
      p.rate
    ].some(x =>
      norm(x).includes(q)
    );

  });


  $("body").innerHTML = list.length

    ? list.map(p => `

      <tr>

        <td>${esc(p.product)}</td>

        <td>${esc(p.density)}</td>

        <td>${esc(p.thickness)}</td>

        <td>${esc(p.unit || "pcs")}</td>

        <td><b>${Number(p.stock || 0)}</b></td>

        <td>${money(p.rate)}</td>

        <td class="row">

          <button
            type="button"
            class="editBtn"
            data-id="${esc(p.id)}"
          >
            Edit
          </button>

          <button
            type="button"
            class="deleteBtn"
            data-id="${esc(p.id)}"
          >
            Delete
          </button>

        </td>

      </tr>

    `).join("")

    : `

      <tr>
        <td colspan="7" class="empty">
          No products added.
        </td>
      </tr>

    `;


  /* Total units */

  const total = data.reduce(
    (a,p) =>
      a + Number(p.stock || 0),
    0
  );


  /* Total value */

  const value = data.reduce(
    (a,p) =>
      a +
      Number(p.stock || 0) *
      Number(p.rate || 0),
    0
  );


  $("total").textContent =
    total.toLocaleString("en-IN");

  $("value").textContent =
    money(value);


  /* Attach buttons safely */

  document
    .querySelectorAll(".editBtn")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => edit(btn.dataset.id)
      );

    });


  document
    .querySelectorAll(".deleteBtn")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => del(btn.dataset.id)
      );

    });

}


/* =========================================================
   FORM
========================================================= */

let mode = "add";


function openForm(newMode,p=null){

  mode = newMode;

  $("form").classList.remove("hidden");

  $("formTitle").textContent =
    newMode === "in"
      ? "➕ Stock In"
      : newMode === "out"
        ? "➖ Stock Out"
        : "➕ Add Product";


  $("product").value = "";
  $("density").value = "";
  $("thickness").value = "";
  $("unit").value = "pcs";
  $("stock").value = "";
  $("rate").value = "";

  delete $("form").dataset.id;


  if(p){

    $("product").value =
      p.product || "";

    $("density").value =
      p.density || "";

    $("thickness").value =
      p.thickness || "";

    $("unit").value =
      p.unit || "pcs";

    $("stock").value =
      Number(p.stock || 0);

    $("rate").value =
      Number(p.rate || 0);

    $("form").dataset.id =
      p.id;

    $("formTitle").textContent =
      "✏️ Edit Product";

    mode = "edit";

  }


  $("form").scrollIntoView({
    behavior:"smooth"
  });

}


function closeForm(){

  $("form").classList.add("hidden");

}


/* =========================================================
   SAVE PRODUCT / EDIT
========================================================= */

function saveProduct(){

  const p =
    $("product").value.trim();

  const d =
    $("density").value.trim();

  const t =
    $("thickness").value.trim();

  const u =
    $("unit").value.trim() || "pcs";

  const s =
    Number($("stock").value);

  const r =
    Number($("rate").value);


  if(
    !p ||
    !d ||
    !t ||
    !Number.isFinite(s) ||
    s < 0 ||
    !Number.isFinite(r) ||
    r < 0
  ){

    alert(
      "Please fill all product fields correctly."
    );

    return;
  }


  /* EDIT EXISTING PRODUCT */

  if(mode === "edit"){

    const id =
      $("form").dataset.id;

    const index =
      data.findIndex(
        x => String(x.id) === String(id)
      );


    if(index === -1){

      alert(
        "Product not found."
      );

      return;
    }


    data[index] = {

      ...data[index],

      product:p,
      density:d,
      thickness:t,
      unit:u,
      stock:s,
      rate:r

    };


    if(save()){

      closeForm();

      $("status").textContent =
        "✅ Product updated successfully.";

    }

    return;
  }


  /* STOCK IN / STOCK OUT FROM FORM */

  if(
    mode === "in" ||
    mode === "out"
  ){

    const x =
      findExactProduct(
        d,
        t
      );


    if(!x){

      alert(
        "Product not found. Add this product first."
      );

      return;
    }


    const current =
      Number(x.stock || 0);


    if(
      mode === "out" &&
      s > current
    ){

      alert(
        "Stock Out cannot exceed current stock."
      );

      return;
    }


    x.stock =
      mode === "in"
        ? current + s
        : current - s;


    if(r > 0){
      x.rate = r;
    }


    if(save()){

      closeForm();

      $("status").textContent =
        mode === "in"
          ? `Stock In: ${s} pcs. New stock: ${x.stock}`
          : `Stock Out: ${s} pcs. New stock: ${x.stock}`;

    }

    return;
  }


  /* ADD NEW PRODUCT */

  data.push({

    id:makeId(),

    product:p,
    density:d,
    thickness:t,
    unit:u,
    stock:s,
    rate:r

  });


  if(save()){

    closeForm();

    $("status").textContent =
      "✅ Product added successfully.";

  }

}


/* =========================================================
   EDIT
========================================================= */

function edit(id){

  const p =
    data.find(
      x => String(x.id) === String(id)
    );

  if(!p){

    alert("Product not found.");

    return;
  }

  openForm(
    "edit",
    p
  );

}


/* =========================================================
   DELETE
========================================================= */

function del(id){

  const p =
    data.find(
      x => String(x.id) === String(id)
    );

  if(!p) return;


  if(
    confirm(
      `Delete ${p.product} ${p.density} density ${p.thickness}?`
    )
  ){

    data =
      data.filter(
        x => String(x.id) !== String(id)
      );

    save();

    $("status").textContent =
      "Product deleted.";

  }

}


/* =========================================================
   EXACT PRODUCT MATCH
========================================================= */

function findExactProduct(
  density,
  thickness
){

  const d =
    norm(density);

  const t =
    norm(thickness);


  return data.find(x =>

    norm(x.density) === d &&

    norm(x.thickness) === t

  );

}


/* =========================================================
   NUMBER WORDS
========================================================= */

const numberWords = {

  ek:1,
  do:2,
  teen:3,
  char:4,
  chaar:4,
  paanch:5,
  panch:5,
  chhe:6,
  che:6,
  saat:7,
  aath:8,
  nau:9,
  das:10,

  one:1,
  two:2,
  three:3,
  four:4,
  five:5,
  six:6,
  seven:7,
  eight:8,
  nine:9,
  ten:10,

  "एक":1,
  "दो":2,
  "तीन":3,
  "चार":4,
  "पाँच":5,
  "पांच":5,
  "छह":6,
  "छः":6,
  "सात":7,
  "आठ":8,
  "नौ":9,
  "दस":10

};


/* =========================================================
   QUANTITY PARSER
========================================================= */

function getQuantity(original){

  const raw =
    String(original || "");

  const n =
    norm(raw);


  /*
    IMPORTANT:

    पहले mattress/gadda से ठीक पहले
    quantity खोजेंगे।

    इसलिए:

    40 density 4 inch ke 2 gadde bik gaye

    में quantity = 2

    density = 40
    thickness = 4
  */


  let m =
    n.match(
      /(\d+(?:\.\d+)?)\s*(?:gadde|gadda|pcs|pieces|piece|items|units|unit|nang|nag)\b/i
    );


  if(m){

    return Number(m[1]);

  }


  /*
    Hindi quantity
  */

  const hindi =
    raw.match(
      /(एक|दो|तीन|चार|पाँच|पांच|छह|छः|सात|आठ|नौ|दस)\s*(?:गद्दे|गद्दों|गद्दा|पीस|पीसेज|नग)\b/
    );


  if(hindi){

    return numberWords[hindi[1]];

  }


  /*
    Roman/Hinglish quantity
  */

  const roman =
    n.match(
      /\b(ek|do|teen|char|chaar|paanch|panch|chhe|che|saat|aath|nau|das|one|two|three|four|five|six|seven|eight|nine|ten)\s+(?:gadde|gadda)\b/i
    );


  if(roman){

    return numberWords[
      roman[1].toLowerCase()
    ];

  }


  /*
    अगर ऊपर कुछ नहीं मिला,
    तो numbers निकालो लेकिन
    density और thickness हटाओ।
  */

  const nums =
    [...n.matchAll(
      /\b\d+(?:\.\d+)?\b/g
    )].map(
      x => Number(x[0])
    );


  const densityMatch =
    n.match(
      /(\d+(?:\.\d+)?)\s*density/i
    );

  const thicknessMatch =
    n.match(
      /(\d+(?:\.\d+)?)\s*inch/i
    );


  const excluded = new Set();


  if(densityMatch){
    excluded.add(
      Number(densityMatch[1])
    );
  }


  if(thicknessMatch){
    excluded.add(
      Number(thicknessMatch[1])
    );
  }


  const remaining =
    nums.filter(
      x => !excluded.has(x)
    );


  if(remaining.length){

    return remaining[
      remaining.length - 1
    ];

  }


  return 1;

}


/* =========================================================
   SALE / STOCK OUT DETECTION
========================================================= */

function isStockOut(text){

  const raw =
    String(text || "")
      .toLowerCase();

  const n =
    norm(raw);


  /*
    Hindi phrases सीधे check
  */

  if(
    /बिक\s*गए|बिक\s*गये|बिके|बिका|बेच\s*दिए|बेच\s*दिये|निकाल\s*दिए|निकाल\s*दिये/
      .test(raw)
  ){

    return true;

  }


  /*
    Roman / English
  */

  return /(
    \bbik\b|
    \bbike\b|
    \bbika\b|
    \bbikgaye\b|
    \bbikgaya\b|
    \bsell\b|
    \bsold\b|
    \bsale\b|
    \bout\b|
    \bremove\b|
    \bnikal\b|
    \bnikala\b|
    \bnikle\b|
    \bbech\b
  )/ix.test(n);

}


/* =========================================================
   STOCK IN DETECTION
========================================================= */

function isStockIn(text){

  const raw =
    String(text || "")
      .toLowerCase();

  const n =
    norm(raw);


  if(
    /आया|आए|जमा|खरीदा|खरीदे|मिला|मिले/.test(raw)
  ){

    return true;

  }


  return /(
    \badd\b|
    \bin\b|
    \baaya\b|
    \baaye\b|
    \bmila\b|
    \bpurchase\b|
    \bkharida\b|
    \bkharide\b
  )/i.test(n);

}


/* =========================================================
   COMMAND PARSER
========================================================= */

function parseCommand(text){

  const original =
    String(text || "");

  const n =
    norm(original);


  /*
    Density
  */

  const d =
    n.match(
      /(\d+(?:\.\d+)?)\s*density/i
    );


  /*
    Thickness
  */

  const th =
    n.match(
      /(\d+(?:\.\d+)?)\s*inch/i
    );


  if(!d || !th){

    return null;

  }


  const q =
    getQuantity(original);


  const out =
    isStockOut(original);


  const inn =
    isStockIn(original);


  return {

    q:q,
    d:d[1],
    th:th[1] + " inch",
    out:out,
    in:inn

  };

}


/* =========================================================
   PROCESS COMMAND
========================================================= */

function processCommand(){

  const raw =
    $("cmd").value.trim();


  if(!raw){

    $("status").textContent =
      "Please speak or type a command.";

    return;

  }


  const c =
    parseCommand(raw);


  if(!c){

    $("status").textContent =
      "Command samajh nahi aaya. Example: 40 density ke 4 inch ke 2 gadde bik gaye";

    return;

  }


  /*
    EXACT MATCH:
    Density + Thickness
  */

  const p =
    findExactProduct(
      c.d,
      c.th
    );


  if(!p){

    $("status").textContent =
      `Product not found: ${c.d} density, ${c.th}.`;

    return;

  }


  const current =
    Number(p.stock || 0);


  /* =========================
     STOCK OUT
  ========================= */

  if(c.out){

    if(current < c.q){

      $("status").textContent =
        `Insufficient stock. Current: ${current} ${p.unit || "pcs"}`;

      return;

    }


    p.stock =
      current - c.q;


    save();


    $("status").textContent =
      `✅ Stock Out: ${c.q} ${p.unit || "pcs"}. New stock: ${p.stock}`;

    return;

  }


  /* =========================
     STOCK IN
  ========================= */

  if(c.in){

    p.stock =
      current + c.q;


    save();


    $("status").textContent =
      `✅ Stock In: ${c.q} ${p.unit || "pcs"}. New stock: ${p.stock}`;

    return;

  }


  /*
    अगर ना sale ना purchase
  */

  $("status").textContent =
    "Say 'bik gaye' for Stock Out or 'add/aaya' for Stock In.";

}


/* =========================================================
   BUTTON EVENTS
