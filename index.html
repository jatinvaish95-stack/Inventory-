<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff4c7"><title>City Group Stock Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#18213a;font-family:Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:16px 14px 35px}header{text-align:center;padding:10px 0 18px}
h1{margin:0;font-size:28px}.sub{font-size:19px;margin-top:3px}header p{color:#777}
.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 15px #0001}
h2{font-size:20px;margin:0 0 14px}.voicebox{border:1px solid #ddd;border-radius:14px;padding:13px}
textarea,input{width:100%;padding:13px;border:1px solid #d9dce5;border-radius:12px;font-size:16px}
textarea{height:82px;resize:vertical}.buttons,.stats,.actions,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}.speak{background:#f9c83d}.process{background:#18213a;color:white}
.status{margin-top:10px;background:#f1f2f5;border-radius:10px;padding:10px;min-height:40px;color:#555}
.stat{padding:17px;text-align:center;border-radius:15px;background:#eeeaff}.stat:nth-child(2){background:#fff1bd}.stat b{display:block;font-size:26px;margin-top:5px}
.action{background:#f7f8fb;border:1px solid #e4e6ec;text-align:left}.action small{display:block;color:#777;margin-top:4px;font-weight:400}
.add{background:#16a34a;color:#fff;width:100%;margin-top:10px}.cancel{background:#eee;width:100%;margin-top:7px}.hidden{display:none}.search{margin-bottom:10px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #eee;white-space:nowrap}th{background:#f4f4f5}
.row button{padding:7px 8px;font-size:12px;margin-right:3px}.empty{text-align:center;color:#777;padding:20px}
@media(max-width:480px){.app{padding:10px}h1{font-size:25px}}
</style></head>
<body><div class="app">
<header><div style="font-size:30px">🏢</div><h1>CITY GROUP</h1><div class="sub">Stock Manager</div><p>Speak Your Stock Command</p></header>
<section class="card"><h2>🎙️ Voice Command</h2><div class="voicebox">
<div style="color:#777;font-size:13px;margin-bottom:8px">Example: “40 density ke 4 inch ke 2 gadde bik gaye”</div>
<textarea id="cmd" placeholder="Speak or type your command..."></textarea>
<div class="buttons"><button class="speak" id="speak">🎙️ Speak</button><button class="process" id="process">⚡ Process</button></div>
<div class="status" id="status">Ready.</div></div></section>
<section class="card"><h2>📊 Overview</h2><div class="stats"><div class="stat">Total Stock Units<b id="total">0</b></div><div class="stat">Inventory Value<b id="value">₹0</b></div></div></section>
<section class="card"><h2>⚡ Quick Actions</h2><div class="actions">
<button class="action" id="stockInBtn">➕ Stock In<small>Add stock</small></button><button class="action" id="stockOutBtn">➖ Stock Out<small>Sell / remove</small></button>
<button class="action" id="inventoryBtn">📦 Inventory<small>Add product</small></button><button class="action" id="rateBtn">💰 Rate List<small>Search rates</small></button>
</div></section>
<section class="card hidden" id="form"><h2 id="formTitle">➕ Add Product</h2><div class="formgrid">
<input id="product" placeholder="Product (e.g. Gadda)"><input id="density" placeholder="Density (e.g. 40)">
<input id="thickness" placeholder="Thickness (e.g. 4 inch)"><input id="unit" placeholder="Unit (e.g. pcs)" value="pcs">
<input id="stock" type="number" min="0" placeholder="Stock"><input id="rate" type="number" min="0" placeholder="Rate">
</div><button class="add" id="saveProductBtn">💾 Save</button><button class="cancel" id="cancelBtn">Cancel</button></section>
<section class="card"><h2>📦 Current Inventory</h2><input class="search" id="search" placeholder="🔎 Search product, density, thickness...">
<div class="wrap"><table><thead><tr><th>Product</th><th>Density</th><th>Thickness</th><th>Unit</th><th>Stock</th><th>Rate</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></section>
</div>
<script>

const KEY="city_group_stock_manager_v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}
const $=id=>document.getElementById(id);

function norm(s){return String(s??"").toLowerCase()
 .replace(/डेंसिटी/g," density ").replace(/इंच/g," inch ")
 .replace(/गद्दों/g," gadde ").replace(/गद्दे/g," gadde ").replace(/गद्दा/g," gadda ")
 .replace(/[^\p{L}\p{N}.\s-]/gu," ").replace(/\s+/g," ").trim();}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}

function render(){
 const q=norm($("search").value);
 const list=data.filter(p=>!q||[p.product,p.density,p.thickness,p.unit,p.stock,p.rate].some(x=>norm(x).includes(q)));
 $("body").innerHTML=list.length?list.map(p=>`<tr><td>${esc(p.product)}</td><td>${esc(p.density)}</td><td>${esc(p.thickness)}</td><td>${esc(p.unit||"pcs")}</td><td><b>${Number(p.stock||0)}</b></td><td>${money(p.rate)}</td><td>—</td></tr>`).join(""):`<tr><td colspan="7" class="empty">No products added.</td></tr>`;
 $("total").textContent=data.reduce((a,p)=>a+Number(p.stock||0),0).toLocaleString("en-IN");
 $("value").textContent=money(data.reduce((a,p)=>a+Number(p.stock||0)*Number(p.rate||0),0));
}

function openForm(mode){$("form").classList.remove("hidden");$("formTitle").textContent=mode==="in"?"➕ Stock In":mode==="out"?"➖ Stock Out":"➕ Add Product";$("form").dataset.mode=mode;["product","density","thickness","stock","rate"].forEach(x=>$(x).value="");$("unit").value="pcs";}
function closeForm(){$("form").classList.add("hidden");}
function saveProduct(){
 const product=$("product").value.trim(),density=$("density").value.trim(),thickness=$("thickness").value.trim(),unit=$("unit").value.trim()||"pcs",stock=Number($("stock").value||0),rate=Number($("rate").value||0),mode=$("form").dataset.mode||"add";
 if(!product||!density||!thickness||stock<0||rate<0){alert("Please fill all product fields correctly.");return;}
 if(mode==="in"||mode==="out"){
   const p=data.find(x=>norm(x.density)===norm(density)&&norm(x.thickness)===norm(thickness));
   if(!p){alert("Product not found. Add it first.");return;}
   if(mode==="out"&&stock>Number(p.stock||0)){alert("Stock Out cannot exceed current stock.");return;}
   p.stock=mode==="in"?Number(p.stock||0)+stock:Number(p.stock||0)-stock;
 }else data.push({product,density,thickness,unit,stock,rate});
 save();closeForm();$("status").textContent="✅ Saved successfully.";render();
}
$("inventoryBtn").onclick=()=>openForm("add");
$("stockInBtn").onclick=()=>openForm("in");
$("stockOutBtn").onclick=()=>openForm("out");
$("rateBtn").onclick=()=>$("search").focus();
$("saveProductBtn").onclick=saveProduct;
$("cancelBtn").onclick=closeForm;
$("search").oninput=render;

const words={ek:1,do:2,teen:3,char:4,chaar:4,paanch:5,panch:5,chhe:6,che:6,saat:7,aath:8,nau:9,das:10,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,"एक":1,"दो":2,"तीन":3,"चार":4,"पाँच":5,"पांच":5,"छह":6,"छः":6,"सात":7,"आठ":8,"नौ":9,"दस":10};

function getQty(text){
 const raw=String(text||""),n=norm(raw);
 let m=raw.match(/(?:^|\s)(एक|दो|तीन|चार|पाँच|पांच|छह|छः|सात|आठ|नौ|दस)\s*(?:गद्दे|गद्दों|गद्दा|पीस|नग)(?=\s|$)/);
 if(m)return words[m[1]];
 m=n.match(/\b(ek|do|teen|char|chaar|paanch|panch|chhe|che|saat|aath|nau|das|one|two|three|four|five|six|seven|eight|nine|ten)\s+(?:gadde|gadda)(?=\s|$)/i);
 if(m)return words[m[1].toLowerCase()];
 m=n.match(/\b(\d+(?:\.\d+)?)\s*(?:gadde|gadda|pcs|pieces|piece)\b/i);
 if(m)return Number(m[1]);
 const d=n.match(/(\d+(?:\.\d+)?)\s*density/i),t=n.match(/(\d+(?:\.\d+)?)\s*inch/i);
 const nums=[...n.matchAll(/\b\d+(?:\.\d+)?\b/g)].map(x=>Number(x[0]));
 const rem=nums.filter(x=>x!==Number(d?.[1])&&x!==Number(t?.[1]));
 return rem.length?rem[rem.length-1]:1;
}

function findProduct(text){
 const n=norm(text);let best=null,score=0;
 data.forEach(p=>{
  const d=norm(p.density),t=norm(p.thickness),name=norm(p.product);let s=0;
  if(d&&n.includes(d))s+=5;if(t&&n.includes(t))s+=5;
  if(name&&n.includes(name))s+=3;
  if((name==="gadda"||name==="gadde")&&/गद्द|gadda|gadde/i.test(text))s+=3;
  if(s>score){score=s;best=p;}
 });
 return score>=10?best:null;
}

function intent(text){
 const raw=String(text||"").toLowerCase(),n=norm(raw);
 // Questions/queries must NEVER change stock.
 if(/(?:क्या|क्या है|कितना|कितने|कितनी|बताओ|बता|रेट|भाव|दाम|कीमत|मूल्य|price|rate|cost|how much|what is|show|दिखाओ|list)/i.test(raw) ||
    /\b(rate|price|cost|how much|what is|show|list)\b/i.test(n)) return "query";
 if(/(?:बिक|बेच|बिका|बिके|बिक गया|बिक गए|बेचा|बिकवा|निकाल|गया|गये|गए|sold|sell|sale|out|remove|nikal|bech)/i.test(raw) ||
    /\b(bik|bike|bika|bech|becha|sold|sell|sale|out|remove|nikal)\b/i.test(n)) return "out";
 if(/(?:आया|आए|आई|आया है|आए हैं|आ गई|आ गए|आ गया|माल आया|माल आ गया|मिला|मिले|जमा|खरीदा|खरीदे|स्टॉक आया|स्टॉक आ गया)/i.test(raw) ||
    /\b(add|added|stock in|received|receive|purchase|purchased|aaya|aaye|aayi|aa gaya|aa gaye|aa gayi|mila|mile|kharida|kharide)\b/i.test(n)) return "in";
 return "unknown";
}

function processCommand(){
 const raw=$("cmd").value.trim();

 // NEVER treat an empty Process press as Add.
 if(!raw){
   $("status").textContent="⚠️ Command खाली है — stock में कोई बदलाव नहीं किया गया।";
   return;
 }

 const type=intent(raw);
 const p=findProduct(raw);

 // Questions never change stock.
 if(type==="query"){
   if(!p){$("status").textContent="Product not found. Please mention density and thickness.";return;}
   $("status").textContent=`💰 Rate: ${money(p.rate)} per ${p.unit||"pcs"} | Stock: ${Number(p.stock||0)}`;
   return;
 }

 // Unknown commands never change stock.
 if(type==="unknown"){
   $("status").textContent="⚠️ Command clear नहीं है — stock में कोई बदलाव नहीं किया गया।";
   return;
 }

 if(!p){
   $("status").textContent="⚠️ Product not found — stock में कोई बदलाव नहीं किया गया।";
   return;
 }

 // Quantity MUST be explicitly present. Density/thickness are NOT quantity.
 const rawN=norm(raw);
 let q=null;
 let m=raw.match(/(?:^|\s)(एक|दो|तीन|चार|पाँच|पांच|छह|छः|सात|आठ|नौ|दस)\s*(?:गद्दे|गद्दों|गद्दा|पीस|नग)(?=\s|$)/);
 if(m) q=words[m[1]];

 if(q===null){
   m=rawN.match(/\b(ek|do|teen|char|chaar|paanch|panch|chhe|che|saat|aath|nau|das|one|two|three|four|five|six|seven|eight|nine|ten)\s+(?:gadde|gadda|pcs|pieces|piece)(?=\s|$)/i);
   if(m) q=words[m[1].toLowerCase()];
 }

 if(q===null){
   m=rawN.match(/\b(\d+(?:\.\d+)?)\s*(?:gadde|gadda|pcs|pieces|piece|नग|पीस)(?=\s|$)/i);
   if(m) q=Number(m[1]);
 }

 // Explicit numeric quantity before the action, e.g. "2 gadde aa gaye".
 if(q===null){
   m=rawN.match(/\b(\d+(?:\.\d+)?)\b(?=\s+(?:aa|aaye|aaya|aagaye|bik|bike|sold|sell|gaye|gaya)\b)/i);
   if(m){
     const candidate=Number(m[1]);
     const d=Number((rawN.match(/(\d+(?:\.\d+)?)\s*density/i)||[])[1]);
     const t=Number((rawN.match(/(\d+(?:\.\d+)?)\s*inch/i)||[])[1]);
     if(candidate!==d && candidate!==t) q=candidate;
   }
 }

 if(q===null || !Number.isFinite(q) || q<=0){
   $("status").textContent="⚠️ Quantity साफ़ लिखें, जैसे: “2 गद्दे आ गए” — stock में कोई बदलाव नहीं किया गया।";
   return;
 }

 const cur=Number(p.stock||0);

 if(type==="out"){
   if(cur<q){
     $("status").textContent=`Not enough stock. Available: ${cur} ${p.unit||"pcs"}`;
     return;
   }
   p.stock=cur-q;
   save();
   $("status").textContent=`✅ Stock Out: ${q} ${p.unit||"pcs"}. New stock: ${p.stock}`;
   return;
 }

 if(type==="in"){
   p.stock=cur+q;
   save();
   $("status").textContent=`✅ Stock In: ${q} ${p.unit||"pcs"}. New stock: ${p.stock}`;
   return;
}
$("process").onclick=processCommand;
$("speak").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("status").textContent="Voice recognition unavailable here. Type the command.";return;}
 try{
  const r=new SR();r.lang="hi-IN";r.interimResults=false;r.maxAlternatives=3;
  r.onstart=()=>{$("status").textContent="🎙️ Listening… बोलिए।"};
  r.onresult=e=>{$("cmd").value=e.results?.[0]?.[0]?.transcript||"";$("status").textContent="Voice captured. Tap Process.";};
  r.onerror=e=>$("status").textContent="Voice error: "+e.error;r.start();
 }catch(e){$("status").textContent="Voice could not start. Please allow microphone permission."}
};
render();

</script></body></html>
